<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Детали книги — The Book</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .book-details-layout { display: flex; gap: 4rem; margin-top: 3rem; background: var(--surface); padding: 3rem; border-radius: 24px; border: 1px solid var(--border); }
    .book-left { width: 320px; flex-shrink: 0; }
    .book-cover-large { width: 100%; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--accent-gold); }
    .book-right { flex-grow: 1; }
    .book-title-big { font-family: var(--font-heading); font-size: 3.5rem; color: var(--text); line-height: 1.1; margin-bottom: 1rem; }
    
    /* ЗВЕЗДЫ */
    .rating-container { display: flex; align-items: center; gap: 15px; margin: 1.5rem 0; }
    .stars { display: flex; flex-direction: row-reverse; gap: 5px; }
    .star { font-size: 2.5rem; color: #444; cursor: pointer; transition: 0.3s; }
    .star:hover, .star:hover ~ .star { color: var(--accent-gold); text-shadow: 0 0 15px gold; }
    .star.active { color: var(--accent-gold); }
    .avg-val { font-size: 1.5rem; font-weight: bold; color: var(--accent-gold); background: rgba(212,175,55,0.1); padding: 5px 15px; border-radius: 10px; }

    .book-description { font-size: 1.1rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 2rem; }
    .action-group { display: flex; gap: 1.5rem; }
    .btn-massive { padding: 1.2rem 2.5rem; flex: 1; text-align: center; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
        <div class="header-content">
            <a href="index.html" class="logo">📚 The Book</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="profile.html" class="nav-link">Моя полка</a>
                <a href="shop.html" class="nav-link">Магазин</a>
            </nav>
        </div>
    </div>
  </header>

  <main class="container">
    <div id="bookDetails" class="book-details-layout">
        <p style="text-align: center; width: 100%;">Загрузка знаний...</p>
    </div>
  </main>

    <!-- УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО -->
    <div id="appModal" class="modal-overlay">
        <div class="modal-window">
            <span id="modalIcon" class="modal-icon">📚</span>
            <h3 id="modalTitle" class="modal-title">Заголовок</h3>
            <p id="modalText" class="modal-text">Текст сообщения...</p>
            <div id="modalActions" class="modal-actions">
                <!-- Кнопки будут генерироваться через JS -->
            </div>
        </div>
    </div>

  <script>
    const API_URL = "http://localhost:5283/api";
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get('id');

    document.addEventListener('DOMContentLoaded', () => {
        if (!bookId) { window.location.href = "catalog.html"; return; }
        loadBookDetails();
    });

    // === ФУНКЦИИ МОДАЛЬНОГО ОКНА (ОБЯЗАТЕЛЬНО) ===
    function showModal({ title, text, icon, onConfirm, showCancel = true }) {
        const modal = document.getElementById('appModal');
        // Проверка на случай, если HTML забыли вставить
        if(!modal) { alert(text); return; }

        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = text;
        document.getElementById('modalIcon').innerText = icon || '🔔';
        
        const actionsEl = document.getElementById('modalActions');
        actionsEl.innerHTML = '';

        if (showCancel) {
            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-modal btn-cancel';
            cancelBtn.innerText = 'Отмена';
            cancelBtn.onclick = closeModal;
            actionsEl.appendChild(cancelBtn);
        }

        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'btn-modal btn-confirm';
        confirmBtn.innerText = 'OK';
        confirmBtn.onclick = () => {
            if (onConfirm) onConfirm();
            closeModal();
        };
        actionsEl.appendChild(confirmBtn);

        modal.classList.add('active');
    }

    function closeModal() {
        const modal = document.getElementById('appModal');
        if(modal) modal.classList.remove('active');
    }

    // === ОСНОВНАЯ ЛОГИКА ===
    async function loadBookDetails() {
        try {
            const res = await fetch(`${API_URL}/books/${bookId}`);
            if (!res.ok) throw new Error();
            const book = await res.json();

            let isBorrowed = false;
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const shelfRes = await fetch(`${API_URL}/library/my-books`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if(shelfRes.ok) {
                        const myBooks = await shelfRes.json();
                        isBorrowed = myBooks.some(b => b.id == bookId);
                    }
                } catch(e) { console.log("Ошибка проверки полки", e); }
            }

            renderPage(book, isBorrowed);
        } catch (e) {
            document.getElementById('bookDetails').innerHTML = "<h2 style='text-align:center'>Книга не найдена</h2>";
        }
    }

    function renderPage(book, isBorrowed) {
        const container = document.getElementById('bookDetails');
        container.innerHTML = `
            <div class="book-left">
                <img src="${book.coverImage || 'assets/images/placeholder.jpg'}" class="book-cover-large">
            </div>
            <div class="book-right">
                <h1 class="book-title-big">${book.title}</h1>
                
                <div class="rating-container">
                    <div class="stars">
                        <span class="star" onclick="sendRate(5)">★</span>
                        <span class="star" onclick="sendRate(4)">★</span>
                        <span class="star" onclick="sendRate(3)">★</span>
                        <span class="star" onclick="sendRate(2)">★</span>
                        <span class="star" onclick="sendRate(1)">★</span>
                    </div>
                    <div class="avg-val">★ ${book.rating || 0}</div>
                </div>

                <p style="color:var(--text); font-weight:600; margin-bottom:1rem;">${book.author} • ${book.genre}</p>
                <div class="book-description">${book.description}</div>
                
                <div class="action-group">
                    <a href="${book.fileUrl || '#'}" target="_blank" class="btn btn-primary btn-massive">Читать</a>
                    <button onclick="toggleShelf(${book.id}, ${isBorrowed})" class="btn ${isBorrowed ? 'btn-secondary' : 'btn-primary'} btn-massive">
                        ${isBorrowed ? 'Убрать из полки' : 'В избранное'}
                    </button>
                </div>
            </div>
        `;
    }

    async function sendRate(val) {
        const token = localStorage.getItem('token');
        
        if(!token) { 
            showModal({
                title: "Вход не выполнен",
                text: "Чтобы ставить оценки, нужно войти в аккаунт.",
                icon: "🔒",
                showCancel: false,
                onConfirm: () => window.location.href = 'login.html'
            });
            return; 
        }

        try {
            const res = await fetch(`${API_URL}/books/rate`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ BookId: parseInt(bookId), Rating: parseInt(val) })
            });

            if(res.ok) {
                showModal({
                    title: "Спасибо!",
                    text: "Ваша оценка успешно сохранена.",
                    icon: "✨",
                    showCancel: false,
                    onConfirm: () => location.reload()
                });
            } else {
                showModal({ title: "Ошибка", text: "Не удалось сохранить оценку.", showCancel: false, icon: "❌" });
            }
        } catch (e) {
            showModal({ title: "Ошибка сети", text: "Сервер недоступен.", showCancel: false, icon: "🔌" });
        }
    }

    async function toggleShelf(id, status) {
        const token = localStorage.getItem('token');
        if(!token) {
             showModal({
                title: "Вход не выполнен",
                text: "Войдите, чтобы добавлять книги в избранное.",
                icon: "🔒",
                showCancel: false
            });
            return;
        }

        const method = status ? 'DELETE' : 'POST';
        const url = status ? `${API_URL}/library/return/${id}` : `${API_URL}/library/borrow/${id}`;
        
        try {
            const res = await fetch(url, { method, headers: { 'Authorization': `Bearer ${token}` } });
            if(res.ok) {
                showModal({
                    title: status ? "Убрано" : "Добавлено",
                    text: status ? "Книга убрана с полки." : "Книга добавлена в вашу коллекцию!",
                    icon: status ? "🗑️" : "📚",
                    showCancel: false,
                    onConfirm: () => location.reload()
                });
            }
        } catch(e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
