<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Библиотека — Каталог</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* --- ШАПКА КАТАЛОГА --- */
    .catalog-header { text-align: center; margin: 3rem 0; }
    .page-title { font-family: var(--font-heading); font-size: 3rem; color: var(--text); margin-bottom: 1.5rem; }
    
    .search-bar { max-width: 600px; margin: 0 auto 2rem; position: relative; }
    .search-input { 
        width: 100%; padding: 1rem 2rem; border-radius: 50px; 
        border: 1px solid var(--border); background: var(--surface); 
        color: var(--text); font-size: 1rem; transition: all 0.3s;
        box-shadow: var(--shadow);
    }
    .search-input:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }

    /* --- СЕТКА КНИГ (КОМПАКТНАЯ) --- */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); /* Узкие карточки */
      gap: 2.5rem;
      padding-bottom: 5rem;
    }

    /* --- КАРТОЧКА КНИГИ (ТОЛЬКО ФОТО И НАЗВАНИЕ) --- */
    .book-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
    }

    .book-cover-wrapper {
      width: 100%;
      aspect-ratio: 2 / 3; /* Классический книжный формат */
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.4s ease;
    }

    .book-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .book-title {
    margin-top: 1rem;
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    /* Универсальная обрезка */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2; /* Добавили стандартное свойство */
    -webkit-box-orient: vertical;
    overflow: hidden;
}

    /* ЭФФЕКТ ПРИ НАВЕДЕНИИ */
    .book-card:hover .book-cover-wrapper {
      transform: translateY(-8px);
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); /* Золотистое свечение */
    }

    .book-card:hover .book-cover {
      transform: scale(1.05);
    }

    .book-card:hover .book-title {
      color: var(--accent-gold);
    }

    /* Анимация появления */
    .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
        .books-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.5rem; }
        .book-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link active">Каталог</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="catalog-header">
        <h1 class="page-title">Библиотека знаний</h1>
        <div class="search-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или автору...">
        </div>
      </div>

      <div id="booksGrid" class="books-grid">
         <!-- Книги загрузятся сюда -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2025 Библиотека «The Book».</p></div>
  </footer>

  <script>
    const API_URL = "http://localhost:5283/api";
    let allBooks = [];

    document.addEventListener('DOMContentLoaded', fetchBooks);

    async function fetchBooks() {
        const grid = document.getElementById('booksGrid');
        grid.innerHTML = '<p style="text-align: center; width: 100%;">Открываем архивы...</p>';

        try {
            const response = await fetch(`${API_URL}/books`);
            if (!response.ok) throw new Error();
            allBooks = await response.json();
            renderBooks(allBooks);
        } catch (error) {
            grid.innerHTML = '<p style="color:red; text-align: center; width: 100%;">Ошибка связи с сервером. Пожалуйста, убедитесь, что бэкенд запущен.</p>';
        }
    }

    function renderBooks(books) {
        const grid = document.getElementById('booksGrid');
        grid.innerHTML = '';

        if (books.length === 0) {
            grid.innerHTML = '<p style="text-align: center; width: 100%;">Книги не найдены.</p>';
            return;
        }

        books.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card fade-in';
            card.style.animationDelay = `${index * 0.05}s`; // Плавное появление по очереди
            
            // Если нет обложки, используем стильную заглушку
            const coverSrc = (book.coverImage && book.coverImage.length > 5) 
                ? book.coverImage 
                : 'assets/images/placeholder-book.jpg';

            card.innerHTML = `
                <div class="book-cover-wrapper" onclick="goToDetails(${book.id})">
                    <img src="${coverSrc}" class="book-cover" alt="${book.title}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                </div>
                <div class="book-title" onclick="goToDetails(${book.id})">${book.title}</div>
            `;
            grid.appendChild(card);
        });
    }

    // Переход на новую страницу деталей
    function goToDetails(id) {
        window.location.href = `book-details.html?id=${id}`;
    }

    // Поиск в реальном времени
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = allBooks.filter(b => 
            b.title.toLowerCase().includes(val) || 
            b.author.toLowerCase().includes(val)
        );
        renderBooks(filtered);
    });
  </script>
</body>
</html>
