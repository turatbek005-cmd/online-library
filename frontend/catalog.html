<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Библиотека — Каталог</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .catalog-header { text-align: center; margin: 2rem 0 3rem; }
    .search-bar { max-width: 500px; margin: 0 auto 1.5rem; display: flex; gap: 10px; }
    .search-input { flex: 1; padding: 0.8rem 1.5rem; border-radius: 30px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
      min-height: 200px;
    }

    .book-card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s;
      display: flex; flex-direction: column;
    }
    .book-card:hover { transform: translateY(-5px); border-color: var(--accent); }
    .book-cover { height: 320px; width: 100%; object-fit: cover; background: #222; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .book-info { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .book-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }
    .book-author { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
    .book-footer { margin-top: auto; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link active">Каталог</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
          <a href="shop.html" class="nav-link">Магазин</a>
          <a href="login.html" class="nav-link">Войти</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="catalog-header">
        <h1 class="page-title">Библиотека знаний</h1>
        <div class="search-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="Поиск книги...">
        </div>
      </div>

      <div id="booksGrid" class="books-grid">
         <p style="text-align: center; width: 100%;">Загрузка книг...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2025 Библиотека «The Book».</p></div>
  </footer>

  <script>
    const API_URL = "http://localhost:5283/api";
    let allBooks = [];
    let myBookIds = []; // Здесь будем хранить ID книг, которые уже у юзера

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        
        // 1. Если залогинен, сначала узнаем, какие книги уже есть на полке
        if (token) {
            try {
                const res = await fetch(`${API_URL}/library/my-books`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const myBooks = await res.json();
                    myBookIds = myBooks.map(b => b.id);
                }
            } catch (e) { console.error("Ошибка загрузки полки", e); }
        }

        // 2. Загружаем весь каталог
        fetchBooks();
    });

    async function fetchBooks() {
        const grid = document.getElementById('booksGrid');
        try {
            const response = await fetch(`${API_URL}/books`);
            allBooks = await response.json();
            renderBooks(allBooks);
        } catch (error) {
            grid.innerHTML = '<p style="color:red;">Ошибка связи с сервером.</p>';
        }
    }

    function renderBooks(books) {
        const grid = document.getElementById('booksGrid');
        grid.innerHTML = '';

        if (books.length === 0) {
            grid.innerHTML = '<p>Книг не найдено.</p>';
            return;
        }

        books.forEach(book => {
            const isBorrowed = myBookIds.includes(book.id);
            const imageHtml = book.coverImage 
                ? `<img src="${book.coverImage}" class="book-cover">` 
                : `<div class="book-cover">📖</div>`;

            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `
                ${imageHtml}
                <div class="book-info">
                    <h3 class="book-title">${book.title}</h3>
                    <p class="book-author">${book.author}</p>
                    <div class="book-footer">
                        <button class="btn btn-primary btn-small btn-full" 
                            onclick="takeBook(${book.id}, '${book.title.replace(/'/g, "\\'")}')"
                            ${isBorrowed ? 'disabled style="opacity:0.5"' : ''}>
                            ${isBorrowed ? 'В полке ✓' : 'Взять'}
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ЛОГИКА "ВЗЯТЬ КНИГУ" (Через Бэкенд)
    async function takeBook(id, title) {
        const token = localStorage.getItem('token');
        if (!token) {
            alert("Сначала войдите в аккаунт!");
            window.location.href = "login.html";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/library/borrow/${id}`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (response.ok) {
                alert(`Книга "${title}" добавлена!`);
                myBookIds.push(id); // Добавляем в локальный список
                renderBooks(allBooks); // Перерисовываем кнопки
            } else {
                alert(data.message || "Не удалось взять книгу");
            }
        } catch (err) {
            alert("Ошибка связи с сервером");
        }
    }

    // Поиск
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = allBooks.filter(b => 
            b.title.toLowerCase().includes(val) || 
            b.author.toLowerCase().includes(val)
        );
        renderBooks(filtered);
    });
  </script>
</body>
</html>
