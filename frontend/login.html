<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — The Book</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">

  <style>
   
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link">Магазин</a>

        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <h1 class="page-title">С возвращением</h1>
          <p>Введите свои данные для входа в библиотеку</p>
          
          <form class="form" id="loginForm"> 
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem; padding: 14px;">Войти</button>
          </form>
          
          <div class="auth-footer" style="margin-top: 1.5rem; text-align: center;">
            <p>Еще нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
        <h2 id="modalTitle" class="modal-title">Ошибка</h2>
        <p id="modalMessage" class="modal-text">Текст сообщения</p>
        <button onclick="closeModal()" class="btn btn-primary" style="padding: 10px 30px;">OK</button>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>
  
  <script src="js/login.js"></script>
</body>
</html>
