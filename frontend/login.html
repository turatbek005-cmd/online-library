<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Библиотека — Вход</title>
  <link rel="stylesheet" href="css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container ">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="login.html" class="nav-link active">Войти</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-container">
        <div class="auth-card">
          <h1 class="page-title" style="margin-bottom: 2rem;">Вход в аккаунт</h1>
          
          <form class="form" id="loginForm">
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="ivan@example.com" required>
            </div>
            <div class="form-group">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Войти</button>
          </form>
          
          <div class="auth-footer" style="text-align: center; margin-top: 1.5rem;">
            <p>Нет аккаунта? <a href="register.html" style="color: var(--accent); font-weight: 600;">Зарегистрироваться</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>
  
  <script src="script.js"></script>
</body>
</html>
