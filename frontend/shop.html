<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин карт — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    /* === СТИЛИ МАГАЗИНА === */
    .balance-widget {
      background: linear-gradient(135deg, #1a1a1a, #2d1f1b);
      border: 1px solid var(--accent-gold);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      position: fixed;
      top: 90px;
      right: 5%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    .emerald-icon { font-size: 1.5rem; filter: drop-shadow(0 0 5px #2e8b57); }
    .balance-amount { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 700; color: var(--accent-gold); }

    .rank-section { margin-bottom: 4rem; }
    .rank-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 2rem; padding-bottom: 1rem;
      border-bottom: 1px solid rgba(139, 69, 19, 0.2);
    }
    .rank-letter { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 700; line-height: 1; }
    .rank-title { font-size: 1.5rem; color: var(--text); }

    /* ЦВЕТА РАНГОВ */
    .rank-s .rank-letter { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
    .rank-a .rank-letter { color: #9b5de5; text-shadow: 0 0 10px rgba(155, 93, 229, 0.4); }
    .rank-b .rank-letter { color: #00bbf9; }
    .rank-c .rank-letter { color: #00f5d4; }
    .rank-d .rank-letter { color: #a8a8a8; }
    .rank-e .rank-letter { color: #cd7f32; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }

    .shop-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1rem;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
    }
    .shop-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-hover); }

    .card-image-container {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
      position: relative;
      border: 2px solid transparent;
      background: #000;
    }
    .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .shop-card:hover .card-image { transform: scale(1.05); }

    /* Рамки */
    .rank-s .card-image-container { border-color: #ffd700; }
    .rank-a .card-image-container { border-color: #9b5de5; }
    .rank-b .card-image-container { border-color: #00bbf9; }
    .rank-c .card-image-container { border-color: #00f5d4; }
    .rank-d .card-image-container { border-color: #a8a8a8; }
    .rank-e .card-image-container { border-color: #cd7f32; }

    .card-info { text-align: center; }
    .card-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text); }
    
    .card-price {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 600; color: var(--text);
      margin-bottom: 1rem; background: rgba(0,0,0,0.05);
      padding: 4px 12px; border-radius: 20px; font-size: 0.9rem;
    }

    .btn-buy {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--text); color: white; cursor: pointer; transition: 0.3s;
    }
    .btn-buy:hover { background: var(--accent); }

    /* === СТИЛИ КАСТОМНОЙ МОДАЛКИ === */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center; z-index: 10000;
        animation: fadeIn 0.3s ease;
    }
    .modal-content {
        background: var(--surface); padding: 2.5rem; border-radius: 24px;
        border: 1px solid var(--accent-gold); text-align: center;
        max-width: 420px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link active">Магазин</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="balance-widget" id="balanceWidget">
    <span class="emerald-icon">💎</span>
    <span class="balance-amount" id="userBalance">0</span>
  </div>

  <main>
    <div class="container">
      <h1 class="page-title">Магазин карт</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 3rem;">
        Загрузка артефактов из древней библиотеки...
      </p>

      <div id="shopContent">
          <p style="text-align: center;">Синхронизация...</p>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО (ВМЕСТО CONFIRM) -->
  <div id="confirmModal" class="modal-overlay">
      <div class="modal-content">
          <div class="modal-icon">📜</div>
          <h2 style="font-family: var(--font-heading); color: var(--text);">Подтвердите покупку</h2>
          <p id="modalMessage" style="margin-top:1rem; color: var(--text-muted); font-size: 1.1rem;"></p>
          <div class="modal-buttons">
              <button id="confirmOk" class="btn btn-primary">Купить</button>
              <button id="confirmCancel" class="btn btn-secondary">Отмена</button>
          </div>
      </div>
  </div>  
     <!-- Модальное окно для уведомлений (Успех/Ошибка) -->
  <div id="notificationModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div id="notificationIcon" class="modal-icon">✨</div>
          <h2 id="notificationTitle" style="font-family: var(--font-heading); color: var(--text);">Уведомление</h2>
          <p id="notificationMessage" style="margin-top:1rem; color: var(--text-muted); font-size: 1.1rem;"></p>
          <div class="modal-buttons">
              <button onclick="closeNotification()" class="btn btn-primary">Понятно</button>
          </div>
      </div>
  </div>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>

  <script>
    // 1. Прячем IP адрес в переменную (localhost безопаснее, чем 127.0.0.1)
    const HOST = "localhost:5283"; 
    const API_URL = `http://${HOST}/api`;

    document.addEventListener('DOMContentLoaded', () => {
        updateUIBalance();
        loadShopShowcase();
    });

    function updateUIBalance() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('userBalance').textContent = user.emeralds || 0;
        }
    }

    async function loadShopShowcase() {
        const content = document.getElementById('shopContent');
        const token = localStorage.getItem('token');
        
        try {
            const response = await fetch(`${API_URL}/shop/showcase`, {
                headers: { 'Authorization': token ? `Bearer ${token}` : '' }
            });

            if (!response.ok) throw new Error("Ошибка загрузки");
            const cards = await response.json();
            
            if (cards.length === 0) {
                content.innerHTML = '<p style="text-align:center;">Магазин пуст.</p>';
                return;
            }

            const ranks = ['S', 'A', 'B', 'C', 'D', 'E'];
            const rankNames = { 'S': 'Легендарные', 'A': 'Эпические', 'B': 'Редкие', 'C': 'Необычные', 'D': 'Обычные', 'E': 'Базовые' };

            let finalHtml = '';
            ranks.forEach(r => {
                const filteredCards = cards.filter(c => c.rank.toUpperCase() === r);
                if (filteredCards.length > 0) {
                    finalHtml += `
                        <section class="rank-section rank-${r.toLowerCase()}">
                            <div class="rank-header">
                                <span class="rank-letter">${r}</span>
                                <span class="rank-title">${rankNames[r]}</span>
                            </div>
                            <div class="cards-grid">
                                ${filteredCards.map(card => `
                                    <div class="shop-card">
                                        <div class="card-image-container">
                                            <img src="${card.image_url || 'assets/images/card/common/D.jpg'}" class="card-image">
                                        </div>
                                        <div class="card-info">
                                            <h3 class="card-name">${card.name}</h3>
                                            <div class="card-price">💎 ${card.price}</div>
                                            <button class="btn-buy" onclick="handlePurchase(${card.id}, ${card.price}, '${card.name}')">Купить</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>`;
                }
            });
            content.innerHTML = finalHtml;
        } catch (error) {
            content.innerHTML = '<p style="text-align:center; color:red;">Ошибка подключения к серверу.</p>';
        }
    }

    // ЛОГИКА КАСТОМНОГО ПОДТВЕРЖДЕНИЯ (Step 3)
    function showCustomConfirm(message) {
        return new Promise((resolve) => {
            const modal = document.getElementById('confirmModal');
            const messageEl = document.getElementById('modalMessage');
            const okBtn = document.getElementById('confirmOk');
            const cancelBtn = document.getElementById('confirmCancel');

            messageEl.textContent = message;
            modal.style.display = 'flex';

            const cleanup = (result) => {
                modal.style.display = 'none';
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                resolve(result);
            };

            okBtn.onclick = () => cleanup(true);
            cancelBtn.onclick = () => cleanup(false);
        });
    }

async function handlePurchase(cardId, price, cardName) {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
        showNotification("Пожалуйста, войдите в аккаунт!", false);
        setTimeout(() => window.location.href = "login.html", 2000);
        return;
    }

    const confirmed = await showCustomConfirm(`Купить артефакт "${cardName}" за ${price} изумрудов?`);
    if (!confirmed) return;

    try {
        const response = await fetch(`${API_URL}/shop/buy-card/${cardId}`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

        const data = await response.json();

        if (response.ok) {
            // ВМЕСТО alert
            showNotification(`Вы успешно приобрели карту: ${cardName}`);
            
            user.emeralds = data.remainingEmeralds; 
            localStorage.setItem('user', JSON.stringify(user));
            updateUIBalance();
        } else {
            // ВМЕСТО alert
            showNotification(data.message || "Ошибка при покупке", false);
        }
    } catch (error) {
        showNotification("Ошибка связи с сервером", false);
    }
}
    // Функция для показа уведомлений (вместо alert)
function showNotification(message, isSuccess = true) {
    const modal = document.getElementById('notificationModal');
    const icon = document.getElementById('notificationIcon');
    const title = document.getElementById('notificationTitle');
    const msgEl = document.getElementById('notificationMessage');

    msgEl.textContent = message;
    title.textContent = isSuccess ? "Успех!" : "Внимание";
    icon.textContent = isSuccess ? "🎉" : "⚠️";
    
    modal.style.display = 'flex';
}

// Закрытие уведомления
function closeNotification() {
    document.getElementById('notificationModal').style.display = 'none';
}
  </script>
</body>
</html>
