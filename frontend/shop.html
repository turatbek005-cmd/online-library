<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин карт — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    /* === ОБНОВЛЕННЫЕ СТИЛИ МАГАЗИНА === */
    
    /* Виджет баланса: Светлый стиль */
    .balance-widget {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--accent-gold);
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      position: fixed;
      top: 100px;
      right: 5%;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
    }
    .emerald-icon { font-size: 1.4rem; }
    .balance-amount { 
        font-family: var(--font-heading); 
        font-size: 1.4rem; 
        font-weight: 700; 
        color: var(--text); /* Темный текст */
    }

    .rank-section { margin-bottom: 4rem; }
    .rank-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 2rem; padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .rank-letter { font-family: var(--font-heading); font-size: 3rem; font-weight: 700; line-height: 1; }
    .rank-title { font-size: 1.5rem; color: var(--text); font-family: var(--font-heading); }

    /* ЦВЕТА РАНГОВ */
    .rank-s .rank-letter { color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
    .rank-a .rank-letter { color: #9b5de5; }
    .rank-b .rank-letter { color: #00bbf9; }
    .rank-c .rank-letter { color: #00f5d4; }
    .rank-d .rank-letter { color: #a8a8a8; }
    .rank-e .rank-letter { color: #cd7f32; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 2rem;
    }

    /* Карточка товара: Светлая */
    .shop-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.2rem;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
      box-shadow: var(--shadow);
    }
    .shop-card:hover { 
        transform: translateY(-10px); 
        box-shadow: var(--shadow-hover);
        border-color: var(--accent-light);
    }

    .card-image-container {
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.2rem;
      position: relative;
      border: 2px solid transparent;
      background: #eee;
    }
    .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .shop-card:hover .card-image { transform: scale(1.05); }

    /* Рамки карт */
    .rank-s .card-image-container { border-color: #ffd700; }
    .rank-a .card-image-container { border-color: #9b5de5; }
    .rank-b .card-image-container { border-color: #00bbf9; }
    /* ... остальные рамки опционально ... */

    .card-info { text-align: center; }
    .card-name { 
        font-family: var(--font-heading); 
        font-size: 1.25rem; 
        font-weight: 700; 
        margin-bottom: 0.5rem; 
        color: var(--text); 
    }
    
    .card-price {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 600; color: var(--text);
      margin-bottom: 1rem; 
      background: rgba(139, 69, 19, 0.08);
      padding: 6px 16px; border-radius: 20px; font-size: 1rem;
    }

    .btn-buy {
      width: 100%;
      /* Используем стиль btn-primary, но вручную или через класс */
      background: var(--text); 
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-buy:hover {
        background: var(--accent);
        transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link active">Магазин</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="balance-widget" id="balanceWidget">
    <span class="emerald-icon">💎</span>
    <span class="balance-amount" id="userBalance">0</span>
  </div>

  <main>
    <div class="container">
      <h1 class="hero-title" style="margin-top: 1rem; color: var(--text); font-size: 3.5rem; text-shadow: none;">Магазин карт</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 4rem; font-size: 1.2rem;">
        Приобретайте редкие артефакты для вашей коллекции
      </p>

      <div id="shopContent">
          <p style="text-align: center;">Синхронизация...</p>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО (Теперь использует классы из main.css) -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div class="modal-icon">📜</div>
          <h2 class="modal-title">Подтвердите покупку</h2>
          <p id="modalMessage" class="modal-text"></p>
          <div class="modal-buttons">
              <button id="confirmOk" class="btn btn-primary">Купить</button>
              <button id="confirmCancel" class="btn btn-secondary">Отмена</button>
          </div>
      </div>
  </div>  
  
  <!-- Уведомление -->
  <div id="notificationModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div id="notificationIcon" class="modal-icon">✨</div>
          <h2 id="notificationTitle" class="modal-title">Уведомление</h2>
          <p id="notificationMessage" class="modal-text"></p>
          <div class="modal-buttons">
              <button onclick="closeNotification()" class="btn btn-primary">Понятно</button>
          </div>
      </div>
  </div>

  <footer class="footer">
    <div class="container">
       <div class="footer-content">
         <p>&copy; 2025 Библиотека «The Book».</p>
       </div>
    </div>
  </footer>

  <script>
    const HOST = "localhost:5283"; 
    const API_URL = `http://${HOST}/api`;

    document.addEventListener('DOMContentLoaded', () => {
        updateUIBalance();
        loadShopShowcase();
    });

    function updateUIBalance() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('userBalance').textContent = user.emeralds || 0;
        }
    }

    async function loadShopShowcase() {
        const content = document.getElementById('shopContent');
        const token = localStorage.getItem('token');
        
        try {
            const response = await fetch(`${API_URL}/shop/showcase`, {
                headers: { 'Authorization': token ? `Bearer ${token}` : '' }
            });

            if (!response.ok) throw new Error("Ошибка загрузки");
            const cards = await response.json();
            
            if (cards.length === 0) {
                content.innerHTML = '<p style="text-align:center;">Магазин пуст.</p>';
                return;
            }

            const ranks = ['S', 'A', 'B', 'C', 'D', 'E'];
            const rankNames = { 'S': 'Легендарные', 'A': 'Эпические', 'B': 'Редкие', 'C': 'Необычные', 'D': 'Обычные', 'E': 'Базовые' };

            let finalHtml = '';
            ranks.forEach(r => {
                const filteredCards = cards.filter(c => c.rank.toUpperCase() === r);
                if (filteredCards.length > 0) {
                    finalHtml += `
                        <section class="rank-section rank-${r.toLowerCase()}">
                            <div class="rank-header">
                                <span class="rank-letter">${r}</span>
                                <span class="rank-title">${rankNames[r]}</span>
                            </div>
                            <div class="cards-grid">
                                ${filteredCards.map(card => `
                                    <div class="shop-card scroll-reveal">
                                        <div class="card-image-container">
                                            <img src="${card.image_url || 'assets/images/card/common/D.jpg'}" class="card-image">
                                        </div>
                                        <div class="card-info">
                                            <h3 class="card-name">${card.name}</h3>
                                            <div class="card-price">💎 ${card.price}</div>
                                            <button class="btn-buy" onclick="handlePurchase(${card.id}, ${card.price}, '${card.name}')">Купить</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>`;
                }
            });
            content.innerHTML = finalHtml;
        } catch (error) {
            content.innerHTML = '<p style="text-align:center; color:var(--status-unavailable);">Ошибка подключения к серверу.</p>';
        }
    }

    function showCustomConfirm(message) {
        return new Promise((resolve) => {
            const modal = document.getElementById('confirmModal');
            const messageEl = document.getElementById('modalMessage');
            const okBtn = document.getElementById('confirmOk');
            const cancelBtn = document.getElementById('confirmCancel');

            messageEl.textContent = message;
            modal.style.display = 'flex';

            const cleanup = (result) => {
                modal.style.display = 'none';
                okBtn.onclick = null;
                cancelBtn.onclick = null;
                resolve(result);
            };

            okBtn.onclick = () => cleanup(true);
            cancelBtn.onclick = () => cleanup(false);
        });
    }

    async function handlePurchase(cardId, price, cardName) {
        const token = localStorage.getItem('token');
        let user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) {
            showNotification("Пожалуйста, войдите в аккаунт!", false);
            setTimeout(() => window.location.href = "login.html", 2000);
            return;
        }

        const confirmed = await showCustomConfirm(`Купить артефакт "${cardName}" за ${price} изумрудов?`);
        if (!confirmed) return;

        try {
            const response = await fetch(`${API_URL}/shop/buy-card/${cardId}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            const data = await response.json();

            if (response.ok) {
                showNotification(`Вы успешно приобрели карту: ${cardName}`);
                user.emeralds = data.remainingEmeralds; 
                localStorage.setItem('user', JSON.stringify(user));
                updateUIBalance();
            } else {
                showNotification(data.message || "Ошибка при покупке", false);
            }
        } catch (error) {
            showNotification("Ошибка связи с сервером", false);
        }
    }

    function showNotification(message, isSuccess = true) {
        const modal = document.getElementById('notificationModal');
        const icon = document.getElementById('notificationIcon');
        const title = document.getElementById('notificationTitle');
        const msgEl = document.getElementById('notificationMessage');

        msgEl.textContent = message;
        title.textContent = isSuccess ? "Успех!" : "Внимание";
        icon.textContent = isSuccess ? "🎉" : "⚠️";
        
        modal.style.display = 'flex';
    }

    function closeNotification() {
        document.getElementById('notificationModal').style.display = 'none';
    }
  </script>
</body>
</html>
