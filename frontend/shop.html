<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин карт — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link active">Магазин</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="balance-widget" id="balanceWidget">
    <span class="emerald-icon">💎</span>
    <span class="balance-amount" id="userBalance">0</span>
  </div>

  <main>
    <div class="container">
      <h1 class="hero-title" style="margin-top: 1rem; color: var(--text); font-size: 3.5rem; text-shadow: none;">Магазин карт</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 4rem; font-size: 1.2rem;">
        Приобретайте редкие артефакты для вашей коллекции
      </p>

      <div id="shopContent">
          <p style="text-align: center;">Синхронизация...</p>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО (Теперь использует классы из main.css) -->
  <div id="confirmModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div class="modal-icon">📜</div>
          <h2 class="modal-title">Подтвердите покупку</h2>
          <p id="modalMessage" class="modal-text"></p>
          <div class="modal-buttons">
              <button id="confirmOk" class="btn btn-primary">Купить</button>
              <button id="confirmCancel" class="btn btn-secondary">Отмена</button>
          </div>
      </div>
  </div>  
  
  <!-- Уведомление -->
  <div id="notificationModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div id="notificationIcon" class="modal-icon">✨</div>
          <h2 id="notificationTitle" class="modal-title">Уведомление</h2>
          <p id="notificationMessage" class="modal-text"></p>
          <div class="modal-buttons">
              <button onclick="closeNotification()" class="btn btn-primary">Понятно</button>
          </div>
      </div>
  </div>

  <footer class="footer">
    <div class="container">
       <div class="footer-content">
         <p>&copy; 2025 Библиотека «The Book».</p>
       </div>
    </div>
  </footer>

  <script src="js/pages/shop.js"></script>
</body>
</html>
