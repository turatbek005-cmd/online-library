<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Магазин карт — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- Можно оставить shop.css для специфичных стилей сетки -->
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link active">Магазин</a>
          <a href="profile.html" class="nav-link">Моя полка</a>
        </nav>
      </div>
    </div>
  </header>

  <div class="balance-widget" id="balanceWidget" style="position: fixed; top: 100px; right: 20px; background: var(--surface); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--accent-gold); z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
    <span class="emerald-icon">💎</span>
    <span class="balance-amount" id="profile-emeralds">0</span>
  </div>

  <main>
    <div class="container">
      <h1 class="hero-title" style="margin-top: 1rem; color: var(--text); font-size: 3.5rem; text-shadow: none;">Магазин карт</h1>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 4rem; font-size: 1.2rem;">
        Приобретайте редкие артефакты для вашей коллекции
      </p>

      <!-- Сюда JS будет вставлять карточки -->
      <div id="shopContent" class="shop-grid">
          <p style="text-align: center; width: 100%;">Загрузка товаров...</p>
      </div>
    </div>
  </main>

  <!-- УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО (генерируется script.js, но можно оставить заглушку) -->
  <div id="appModal" class="modal-overlay">
      <div class="modal-window">
          <span id="modalIcon" class="modal-icon">🔔</span>
          <h3 id="modalTitle" class="modal-title"></h3>
          <p id="modalText" class="modal-text"></p>
          <div id="modalActions" class="modal-actions"></div>
      </div>
  </div>

  <footer class="footer">
    <div class="container">
       <div class="footer-content">
         <p>&copy; 2025 Библиотека «The Book».</p>
       </div>
    </div>
  </footer>

  <!-- 1. Сначала ГЛАВНЫЙ скрипт (авторизация, модалки) -->
  <script src="script.js"></script>
  
  <!-- 2. Потом скрипт МАГАЗИНА -->
  <script src="js/pages/shop.js"></script>
</body>
</html>
