<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моя полка — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- ПРАВИЛЬНЫЕ ПУТИ К CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    /* Дополнительные стили конкретно для профиля */
    .profile-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    
    /* Сайдбар */
    .profile-sidebar .user-card {
      background: var(--surface, #252525);
      padding: 2rem;
      border-radius: 20px;
      text-align: center;
      border: 1px solid var(--border, #333);
      position: sticky;
      top: 100px;
    }
    
    .user-avatar {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    /* Секции */
    .section {
      background: var(--surface, #252525);
      padding: 2rem;
      border-radius: 20px;
      margin-bottom: 2rem;
      border: 1px solid var(--border, #333);
    }

    /* Сетка для коллекции карт */
    .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 1rem;
    }
    .collection-item {
        aspect-ratio: 2/3;
        background: #333;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: transform 0.2s;
    }
    .collection-item:hover { transform: scale(1.05); }
    .collection-item img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Календарь */
    .calendar-wrapper { display: flex; justify-content: center; }
    #readingCalendar { display: flex; gap: 5px; flex-wrap: wrap; max-width: 350px; justify-content: center; }
    .calendar-day { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    
    @media (max-width: 900px) {
        .profile-layout { grid-template-columns: 1fr; }
        .profile-sidebar .user-card { position: static; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="profile.html" class="nav-link active">Моя полка</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title" style="margin-top: 2rem;">Личный кабинет</h1>

      <div class="profile-layout">
        
        <!-- ЛЕВАЯ КОЛОНКА (САЙДБАР) -->
        <aside class="profile-sidebar">
          <div class="user-card">
            <div class="user-avatar">👤</div>
            
            <!-- ДИНАМИЧЕСКИЕ ДАННЫЕ (JS заменит текст) -->
            <h2 id="profile-username" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text);">Загрузка...</h2>
            <p id="profile-email" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">...</p>
            
            <div style="background: rgba(212, 175, 55, 0.15); color: #d4af37; padding: 0.5rem 1rem; border-radius: 20px; display: inline-block; font-weight: 600;">
              💎 <span id="profile-emeralds">0</span>
            </div>

            <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
               <p style="font-size: 0.85rem; color: var(--text-light);">Статус: Читатель</p>
            </div>

            <button id="logoutBtn" class="btn btn-secondary btn-full" style="margin-top: 1rem;">Выйти</button>
          </div>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА (КОНТЕНТ) -->
        <div class="profile-content">
          
          <!-- КОЛЛЕКЦИЯ -->
          <section class="section">
            <h2 class="section-title">🎒 Моя коллекция</h2>
            <div id="collectionContainer">
                <p style="color: var(--text-muted);">Здесь будут ваши карты...</p>
            </div>
          </section>

          <!-- КНИГИ -->
          <section class="section">
            <h2 class="section-title">📖 Читаю сейчас</h2>
            <div id="borrowedBooksList"></div>
            <div id="noBooksMessage" style="text-align: center; padding: 2rem; display: none;">
               <p style="color: var(--text-muted);">Полка пуста. Самое время выбрать книгу!</p>
               <a href="catalog.html" style="color: var(--accent); font-weight: bold;">В каталог →</a>
            </div>
          </section>

          <!-- ИСТОРИЯ -->
          <section class="section">
            <h2 class="section-title">📜 История</h2>
            <div id="historyList"></div>
          </section>

          <!-- КАЛЕНДАРЬ -->
          <section class="section">
            <h2 class="section-title">🔥 Активность</h2>
            <div class="calendar-wrapper">
              <div id="readingCalendar"></div>
            </div>
            <div id="streakInfo" style="text-align: center; margin-top: 1rem; color: var(--accent);"></div>
          </section>

        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>

  <!-- ПОДКЛЮЧАЕМ ВНЕШНИЙ СКРИПТ (Логин, Регистрация, Профиль) -->
  <script src="script.js"></script>

  <!-- ВНУТРЕННИЙ СКРИПТ (Списки книг, Календарь, Коллекция) -->
  <script>
    // --- РЕНДЕР КНИГ, КОЛЛЕКЦИИ И КАЛЕНДАРЯ ---
    function renderAllSections() {
      // 1. КНИГИ
      const books = JSON.parse(localStorage.getItem('borrowedBooks') || '[]');
      const list = document.getElementById('borrowedBooksList');
      const empty = document.getElementById('noBooksMessage');
      
      if (books.length === 0) {
          list.innerHTML = '';
          if(empty) empty.style.display = 'block';
      } else {
          if(empty) empty.style.display = 'none';
          list.innerHTML = books.map(b => `
            <div style="background:var(--surface-alt); padding:1rem; margin-bottom:1rem; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border);">
                <div>
                    <strong style="font-size:1.1rem;">${b.title}</strong><br>
                    <small style="color: var(--text-muted);">${b.author}</small>
                </div>
                <button onclick="returnBook('${b.id}')" class="btn btn-secondary btn-small">Вернуть</button>
            </div>`).join('');
      }

      // 2. КАЛЕНДАРЬ
      const days = JSON.parse(localStorage.getItem('readingDays') || '[]');
      const calendar = document.getElementById('readingCalendar');
      let html = '';
      const today = new Date();
      for(let i=27; i>=0; i--) {
          const d = new Date(); d.setDate(today.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          const active = days.includes(dateStr);
          html += `<div class="calendar-day" style="background:${active ? '#d4af37' : '#333'}; color:${active?'#000':'#777'}">${d.getDate()}</div>`;
      }
      if(calendar) calendar.innerHTML = html;

      // 3. КОЛЛЕКЦИЯ (Пока заглушка, если нет данных)
      const collectionContainer = document.getElementById('collectionContainer');
      const cards = JSON.parse(localStorage.getItem('userCards') || '[]');
      
      if (cards.length > 0) {
          let cardHtml = '<div class="collection-grid">';
          cards.forEach(card => {
             // Используем картинки из твоего дерева файлов
             cardHtml += `
             <div class="collection-item" style="border-color: ${getRankColor(card.rank)}">
                <img src="${card.image || 'assets/images/card/common/D.jpg'}" alt="Card">
             </div>`;
          });
          cardHtml += '</div>';
          collectionContainer.innerHTML = cardHtml;
      }
    }

    function getRankColor(rank) {
        if(rank === 'S') return '#ffd700'; // Gold
        if(rank === 'A') return '#c0c0c0'; // Silver
        return 'transparent';
    }

    function returnBook(id) {
        let books = JSON.parse(localStorage.getItem('borrowedBooks') || '[]');
        books = books.filter(b => b.id !== id);
        localStorage.setItem('borrowedBooks', JSON.stringify(books));
        renderAllSections();
    }

    document.addEventListener('DOMContentLoaded', renderAllSections);
  </script>
</body>
</html>
