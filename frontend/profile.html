<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моя полка — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="profile.html" class="nav-link active">Моя полка</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="hero-title" style="margin-top: 1rem; color: var(--text); font-size: 3rem; text-shadow: none;">Личный кабинет</h1>

      <div class="profile-layout">
        <!-- ЛЕВАЯ КОЛОНКА -->
        <aside class="profile-sidebar">
          <div class="user-card">
            <div class="avatar-container">
                <div class="user-avatar">👤</div>
                <div id="streak-badge" class="streak-badge" style="display: none;">
                    <span id="streak-icon">🔥</span>
                    <span id="streak-count" class="streak-count">0</span>
                </div>
            </div>
            <h2 id="profile-username" style="font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--text);">Загрузка...</h2>
            <p id="profile-email" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">...</p>
            <div style="background: rgba(255, 255, 255, 0.9); border: 1px solid var(--accent-gold); color: var(--text); padding: 0.75rem 1.5rem; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.1);">
              💎 <span id="profile-emeralds">0</span>
            </div>
            <button id="logoutBtn" class="btn btn-secondary btn-full" style="margin-top: 2rem; width: 100%;">Выйти</button>
          </div>
        </aside>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="profile-content">
          <section class="section">
            <h2 class="section-title">🎒 Моя коллекция</h2>
            <div id="collectionContainer">
                <p style="color: var(--text-muted);">Синхронизация артефактов...</p>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">📖 Читаю сейчас</h2>
            <div id="borrowedBooksList"></div>
            <div id="noBooksMessage" style="text-align: center; padding: 2rem; display: none;">
               <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
               <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Полка пуста. Самое время выбрать книгу!</p>
               <a href="catalog.html" class="btn btn-primary">В каталог →</a>
            </div>
          </section>

          <section class="section">
             <h2 class="section-title">🔥 Активность</h2>
             <div class="calendar-wrapper">
               <div id="readingCalendar"></div>
             </div>
           </section>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
         <p>&copy; 2025 Библиотека «The Book».</p>
      </div>
    </div>
  </footer>

  <!-- 1. Главный скрипт (содержит startReadingSession) -->
  <script src="script.js"></script>

  <!-- 2. Скрипт профиля (из шага 1) -->
  <script src="js/pages/profile.js"></script>
</body>
</html>
