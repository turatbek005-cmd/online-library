<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Моя полка — Библиотека</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .profile-sidebar .user-card {
      background: var(--surface);
      padding: 2rem;
      border-radius: 20px;
      text-align: center;
      border: 1px solid var(--border);
      position: sticky;
      top: 100px;
    }
    
    .user-avatar { font-size: 4rem; margin-bottom: 1rem; }

    .section {
      background: var(--surface);
      padding: 2rem;
      border-radius: 20px;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 1rem;
    }

    .collection-item {
        aspect-ratio: 2/3;
        background: #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: transform 0.2s;
        position: relative;
    }
    .collection-item:hover { transform: scale(1.05); }
    .collection-item img { width: 100%; height: 100%; object-fit: cover; }
    
    .rank-tag {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: rgba(0,0,0,0.7);
        color: white;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        padding: 2px 0;
    }

    .calendar-wrapper { display: flex; justify-content: center; }
    #readingCalendar { display: flex; gap: 5px; flex-wrap: wrap; max-width: 350px; justify-content: center; }
    .calendar-day { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    
    @media (max-width: 900px) {
        .profile-layout { grid-template-columns: 1fr; }
        .profile-sidebar .user-card { position: static; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="profile.html" class="nav-link active">Моя полка</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title" style="margin-top: 2rem;">Личный кабинет</h1>

      <div class="profile-layout">
        <aside class="profile-sidebar">
          <div class="user-card">
            <div class="user-avatar">👤</div>
            <h2 id="profile-username" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text);">Загрузка...</h2>
            <p id="profile-email" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">...</p>
            
            <div style="background: rgba(212, 175, 55, 0.15); color: #d4af37; padding: 0.5rem 1rem; border-radius: 20px; display: inline-block; font-weight: 600;">
              💎 <span id="profile-emeralds">0</span>
            </div>

            <button id="logoutBtn" class="btn btn-secondary btn-full" style="margin-top: 2rem;">Выйти</button>
          </div>
        </aside>

        <div class="profile-content">
          <section class="section">
            <h2 class="section-title">🎒 Моя коллекция</h2>
            <div id="collectionContainer">
                <p style="color: var(--text-muted);">Синхронизация артефактов...</p>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">📖 Читаю сейчас</h2>
            <div id="borrowedBooksList"></div>
            <div id="noBooksMessage" style="text-align: center; padding: 2rem; display: none;">
               <p style="color: var(--text-muted);">Полка пуста. Самое время выбрать книгу!</p>
               <a href="catalog.html" style="color: var(--accent); font-weight: bold;">В каталог →</a>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">🔥 Активность</h2>
            <div class="calendar-wrapper">
              <div id="readingCalendar"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>

  <script>
    const API_URL = "http://localhost:5283/api";

    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('token');

        if (!user || !token) {
            window.location.href = "login.html";
            return;
        }

        // Заполняем базовые данные
        document.getElementById('profile-username').innerText = user.username;
        document.getElementById('profile-email').innerText = user.email;
        document.getElementById('profile-emeralds').innerText = user.emeralds || 0;

        // Загружаем данные с сервера
        loadUserCollection(token);
        renderBorrowedBooks();
        renderCalendar();
    });

    // 1. ЗАГРУЗКА КАРТ ИЗ БАЗЫ
    async function loadUserCollection(token) {
        const container = document.getElementById('collectionContainer');
        
        try {
            const response = await fetch(`${API_URL}/shop/my-cards`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) throw new Error("Ошибка доступа");

            const cards = await response.json();

            if (cards.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">У вас пока нет карт. Купите их в магазине!</p>';
                return;
            }

            let html = '<div class="collection-grid">';
            cards.forEach(card => {
                html += `
                <div class="collection-item" style="border-color: ${getRankColor(card.rank)}">
                    <img src="${card.image || 'assets/images/card/common/D.jpg'}" alt="${card.name}">
                    <div class="rank-tag">${card.rank}</div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;

        } catch (error) {
            console.error(error);
            container.innerHTML = '<p style="color: red;">Не удалось загрузить коллекцию. Проверьте бэкенд.</p>';
        }
    }

    function getRankColor(rank) {
        const colors = { 'S': '#ffd700', 'A': '#9b5de5', 'B': '#00bbf9', 'C': '#00f5d4', 'D': '#a8a8a8', 'E': '#cd7f32' };
        return colors[rank.toUpperCase()] || 'transparent';
    }

    // 2. КНИГИ (из LocalStorage пока что)
    function renderBorrowedBooks() {
        const books = JSON.parse(localStorage.getItem('borrowedBooks') || '[]');
        const list = document.getElementById('borrowedBooksList');
        const empty = document.getElementById('noBooksMessage');
        
        if (books.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
            list.innerHTML = books.map(b => `
                <div style="background:rgba(255,255,255,0.05); padding:1rem; margin-bottom:1rem; border-radius:12px; display:flex; justify-content:space-between; align-items:center; border: 1px solid var(--border);">
                    <div>
                        <strong style="font-size:1.1rem; color: var(--text);">${b.title}</strong><br>
                        <small style="color: var(--text-muted);">${b.author}</small>
                    </div>
                    <button onclick="returnBook('${b.id}')" class="btn btn-secondary btn-small">Вернуть</button>
                </div>`).join('');
        }
    }

    function returnBook(id) {
        let books = JSON.parse(localStorage.getItem('borrowedBooks') || '[]');
        books = books.filter(b => b.id != id);
        localStorage.setItem('borrowedBooks', JSON.stringify(books));
        renderBorrowedBooks();
    }

    // 3. КАЛЕНДАРЬ
    function renderCalendar() {
        const calendar = document.getElementById('readingCalendar');
        const today = new Date();
        let html = '';
        for(let i=20; i>=0; i--) {
            const d = new Date(); d.setDate(today.getDate() - i);
            const active = i === 0; // Для примера активен только сегодня
            html += `<div class="calendar-day" style="background:${active ? 'var(--accent)' : 'rgba(0,0,0,0.1)'}; color:${active?'white':'var(--text-light)'}">${d.getDate()}</div>`;
        }
        calendar.innerHTML = html;
    }

    // ВЫХОД
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        window.location.href = "index.html";
    });
  </script>
</body>
</html>
