<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — The Book</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <h1 class="page-title">Регистрация</h1>
          <p>Станьте частью нашего клуба читателей</p>
          
          <form class="form" action="login.html">
            <div class="form-group">
              <label for="fullname" class="form-label">Имя и Фамилия</label>
              <input type="text" id="fullname" class="form-input" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm" class="form-label">Повторите пароль</label>
                <input type="password" id="confirm" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
          </form>
          
          <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>
</body>
</html>
