<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — The Book</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* === ОБЩИЕ СТИЛИ ДЛЯ ЧИТАЕМОСТИ === */
    body { color: #2c2c2c; }

    /* Карточка регистрации */
    .auth-card {
        background: #fdfbf7; /* Светло-бежевый фон */
        border: 1px solid #e0d6c2;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        padding: 2.5rem;
        border-radius: 20px;
    }

    /* Типографика */
    .page-title {
        font-family: 'Cormorant Garamond', serif;
        color: #3d2b1f; /* Коричневый */
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
    }
    
    .auth-card p {
        color: #6b5e51;
        font-family: 'Inter', sans-serif;
    }

    /* Поля формы */
    .form-label {
        color: #3d2b1f;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        margin-bottom: 0.5rem;
        display: block;
    }

    .form-input {
        background: #ffffff;
        color: #1a1a1a; /* Темный текст */
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Inter', sans-serif;
        width: 100%;
    }
    
    .form-input:focus {
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        outline: none;
    }

    /* Кнопка регистрации */
    .btn-primary {
        background: #3d2b1f;
        color: #d4af37;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        border: 1px solid #d4af37;
        padding: 14px;
        font-size: 1rem;
        transition: 0.3s;
    }
    .btn-primary:hover {
        background: #d4af37;
        color: #3d2b1f;
        cursor: pointer;
    }

    /* Модальное окно (Темное на переднем плане) */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center; z-index: 10000;
        animation: fadeIn 0.3s ease;
    }
    .modal-content {
        background: #2b221e;
        padding: 2.5rem; border-radius: 16px;
        border: 1px solid #d4af37; 
        text-align: center;
        max-width: 400px; width: 90%; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
    .modal-text { color: #e0e0e0; margin-bottom: 1.5rem; font-family: 'Inter', sans-serif; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">📚 The Book</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Главная</a>
          <a href="catalog.html" class="nav-link">Каталог</a>
          <a href="shop.html" class="nav-link">Магазин</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <h1 class="page-title">Регистрация</h1>
          <p>Станьте частью нашего клуба читателей</p>
          
          <form class="form" id="registerForm">
            <div class="form-group">
              <label for="username" class="form-label">Имя пользователя</label>
              <input type="text" id="username" class="form-input" placeholder="Иван Иванов" required autocomplete="username">
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm" class="form-label">Повторите пароль</label>
                <input type="password" id="confirm" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Создать аккаунт</button>
          </form>
          
          <div class="auth-footer" style="margin-top: 20px; text-align: center;">
            <p>Уже есть аккаунт? <a href="login.html" style="color: #c59d24; font-weight: bold; text-decoration: none;">Войти</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
        <h2 id="modalTitle" class="modal-title">Ошибка</h2>
        <p id="modalMessage" class="modal-text">Текст сообщения</p>
        <button onclick="closeModal()" class="btn btn-primary" style="padding: 10px 30px;">OK</button>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Библиотека «The Book».</p>
    </div>
  </footer>

  <script>
    const API_URL = "http://localhost:5283/api";

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm').value;

        if (password !== confirmPass) {
            showModal('Внимание', 'Пароли не совпадают!', false);
            return;
        }

        try {
            const response = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            let data;
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.indexOf("application/json") !== -1) {
                data = await response.json();
            } else {
                data = { message: await response.text() };
            }

            if (response.ok) {
                showModal('Добро пожаловать!', 'Аккаунт создан. Войдите в него.', true);
                const okBtn = document.querySelector('#customModal button');
                okBtn.onclick = function() { window.location.href = 'login.html'; };
            } else {
                showModal('Ошибка', data.message || "Не удалось создать аккаунт", false);
            }
        } catch (error) {
            showModal('Ошибка', 'Нет соединения с сервером', false);
        }
    });

    function showModal(title, message, isSuccess) {
        const modal = document.getElementById('customModal');
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerText = message;
        document.getElementById('modalIcon').innerText = isSuccess ? '🎉' : '🛑';
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }
  </script>
</body>
</html>
