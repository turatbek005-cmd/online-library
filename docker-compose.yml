version: '3.8'

services:
  backend:
    build: ./backend
    container_name: library-backend
    ports:
      - "5283:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      # Если нужно, тут можно поменять строку подключения к БД

  frontend:
    build: ./frontend
    container_name: library-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend