<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Регистрация</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>📚 the book</h1>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Главная</a>
                    <a href="catalog.html" class="nav-link">Каталог</a>
                    <a href="login.html" class="nav-link">Войти</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-form">
                    <h2 class="form-title">Регистрация</h2>
                    
                    <form class="form">
                        <div class="form-group">
                            <label for="fullname" class="form-label">ФИО</label>
                            <input type="text" id="fullname" class="form-input" placeholder="Введите ваше полное имя">
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-input" placeholder="Введите ваш email">
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" id="password" class="form-input" placeholder="Придумайте пароль">
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm-password" class="form-label">Подтвердите пароль</label>
                            <input type="password" id="confirm-password" class="form-input" placeholder="Повторите пароль">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
                    </form>
                    
                    <div class="auth-links">
                        <p>Уже есть аккаунт? <a href="login.html" class="link">Войти</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Библиотека. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
