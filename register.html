<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека - Регистрация</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>📚 Библиотека</h1>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Главная</a>
                    <a href="catalog.html" class="nav-link">Каталог</a>
                    <a href="login.html" class="nav-link">Войти</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-form">
                    <div class="form-header">
                        <h2 class="form-title">Создать аккаунт</h2>
                        <p class="form-subtitle">Зарегистрируйтесь для доступа к библиотеке</p>
                    </div>
                    
                    <form class="form">
                        <!-- ФИО -->
                        <div class="form-group">
                            <label for="fullname" class="form-label">ФИО</label>
                            <input 
                                type="text" 
                                id="fullname" 
                                class="form-input" 
                                placeholder="Иванов Иван Иванович"
                                required
                            >
                        </div>
                        
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="example@email.com"
                                required
                            >
                        </div>
                        
                        <!-- Пароль -->
                        <div class="form-group">
                            <label for="password" class="form-label">Пароль</label>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Минимум 8 символов"
                                required
                            >
                            <div class="form-hint">
                                Используйте буквы, цифры и специальные символы
                            </div>
                        </div>
                        
                        <!-- Подтверждение пароля -->
                        <div class="form-group">
                            <label for="confirm-password" class="form-label">Подтверждение пароля</label>
                            <input 
                                type="password" 
                                id="confirm-password" 
                                class="form-input" 
                                placeholder="Повторите пароль"
                                required
                            >
                        </div>
                        
                        <!-- Кнопка регистрации -->
                        <button type="submit" class="btn btn-primary btn-full">
                            Зарегистрироваться
                        </button>
                        
                        <!-- Согласие с условиями -->
                        <div class="form-checkbox">
                            <input type="checkbox" id="terms" required>
                            <label for="terms" class="checkbox-label">
                                Я согласен с <a href="#" class="link">условиями использования</a> и 
                                <a href="#" class="link">политикой конфиденциальности</a>
                            </label>
                        </div>
                    </form>
                    
                    <!-- Ссылка на вход -->
                    <div class="auth-footer">
                        <p>Уже есть аккаунт?</p>
                        <a href="login.html" class="btn btn-secondary btn-full">
                            Войти в систему
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Библиотека. Все права защищены.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
